# saem, built from this source tree, on one machine: the services below, a development issuer and a forms source to try them on.
#
#   sh deploy/install.sh                                    # writes deploy/.env with generated secrets
#   docker compose -f deploy/compose.yaml up -d --build --wait
#
# EVALUATION ONLY. The issuer mints a token for anyone who asks and the console is served over plain HTTP on this machine's
# loopback address: neither belongs on a network. See docs/install.md for what to change before they do.

name: saem

x-probe: &probe
  interval: 3s
  timeout: 3s
  retries: 40
  start_period: 5s

# The one address the issuer is known by — to the people's browsers (which read `*.localhost` as this machine) and to the
# containers (which read it from the network alias below). The same name and port on both sides is what lets a token's
# issuer and the discovery document agree.
x-issuer: &issuer http://issuer.localhost:${SAEM_ISSUER_PORT:?run deploy/install.sh first}/rig

x-bash-probe: &http-health
  <<: *probe
  test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /health HTTP/1.0\\r\\n\\r\\n' >&3 && head -n1 <&3 | grep -q ' 200 '"]

x-logging: &quiet-probes
  # A probe every few seconds is not worth a line, nor is a request that succeeds; one that fails is.
  Logging__LogLevel__Microsoft.AspNetCore: Warning

services:
  issuer:
    image: ghcr.io/navikt/mock-oauth2-server:6.0.4
    environment:
      JSON_CONFIG_PATH: /config/config.json
      SERVER_PORT: ${SAEM_ISSUER_PORT}
    volumes:
      - ./issuer.json:/config/config.json:ro
    ports:
      - "127.0.0.1:${SAEM_ISSUER_PORT}:${SAEM_ISSUER_PORT}"
    networks:
      default:
        aliases: [issuer.localhost]

  forms-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_PASSWORD: ${SAEM_PG_PASSWORD}
      POSTGRES_DB: forms
      MORPH_PASSWORD: ${SAEM_MORPH_DB_PASSWORD}
      FORMBASE_PASSWORD: ${SAEM_FORMBASE_DB_PASSWORD}
    volumes:
      - forms-db:/var/lib/postgresql/data
      - ./init-db.sh:/docker-entrypoint-initdb.d/init.sh:ro
    healthcheck:
      <<: *probe
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d forms"]

  # The forms source: where a form's records live once projected, read as the person asking — saem exchanges the person's token
  # for one meant for MorphDB, and MorphDB's row-level security decides what comes back.
  forms:
    image: ${SAEM_MORPHDB_IMAGE:-ghcr.io/iyulab/morphdb:0.37.0}
    environment:
      ConnectionStrings__MorphDB: Host=forms-db;Port=5432;Database=forms;Username=morph;Password=${SAEM_MORPH_DB_PASSWORD}
      Security__MasterSecret: ${SAEM_FORMS_MASTER_SECRET}
      Security__Tokens__Issuer: *issuer
      Security__Tokens__MetadataAddress: http://issuer.localhost:${SAEM_ISSUER_PORT}/rig/.well-known/openid-configuration
      Security__Tokens__RequireHttpsMetadata: "false"
      Security__Tokens__Audience: morphdb
      <<: *quiet-probes
    depends_on:
      forms-db: {condition: service_healthy}
      issuer: {condition: service_started}
    healthcheck: *http-health

  # One-shot jobs that set the source up. They are safe to run again.
  source-project:
    build: {context: .., dockerfile: deploy/Dockerfile, target: provision}
    entrypoint: ["/provision/source-project.sh"]
    environment:
      SAEM_FORMS_MASTER_SECRET: ${SAEM_FORMS_MASTER_SECRET}
      SAEM_SOURCE_PROJECT_ID: ${SAEM_SOURCE_PROJECT_ID}
    depends_on:
      forms: {condition: service_healthy}
    restart: "no"

  formbase:
    image: ${SAEM_FORMBASE_IMAGE:-ghcr.io/iyulab/formbase:0.37.0}
    environment:
      Formbase__Store: Durable
      ConnectionStrings__Formbase: Host=forms-db;Database=formbase;Username=formbase;Password=${SAEM_FORMBASE_DB_PASSWORD}
      Formbase__Schema: ${SAEM_SOURCE_SCHEMA}
      Formbase__MorphDb__Url: http://forms:8080
      Formbase__MorphDb__ProjectId: ${SAEM_SOURCE_PROJECT_ID}
      Formbase__MorphDb__Secret: ${SAEM_FORMS_MASTER_SECRET}
      PGGSSENCMODE: disable
      <<: *quiet-probes
    depends_on:
      source-project: {condition: service_completed_successfully}
    healthcheck: *http-health

  # Each group has an account on the source and a store of its own; MorphDB issues the secrets, so they pass through a volume
  # only the services that need them read.
  group-accounts:
    build: {context: .., dockerfile: deploy/Dockerfile, target: provision}
    entrypoint: ["/provision/group-accounts.sh"]
    environment:
      SAEM_FORMS_MASTER_SECRET: ${SAEM_FORMS_MASTER_SECRET}
      SAEM_SOURCE_PROJECT_ID: ${SAEM_SOURCE_PROJECT_ID}
      SAEM_G_PLANT_PROJECT_ID: ${SAEM_G_PLANT_PROJECT_ID}
      SAEM_G_OFFICE_PROJECT_ID: ${SAEM_G_OFFICE_PROJECT_ID}
    volumes:
      - secrets:/secrets
    depends_on:
      source-project: {condition: service_completed_successfully}
    restart: "no"

  formbase-g-plant: &group-store
    image: ${SAEM_FORMBASE_IMAGE:-ghcr.io/iyulab/formbase:0.37.0}
    entrypoint: ["sh", "-c", ". /secrets/g-plant.env && exec dotnet Formbase.Host.dll"]
    environment: &group-store-env
      Formbase__Store: Durable
      ConnectionStrings__Formbase: Host=forms-db;Database=formbase;Username=formbase;Password=${SAEM_FORMBASE_DB_PASSWORD}
      Formbase__Schema: ${SAEM_G_PLANT_SCHEMA}
      Formbase__MorphDb__Url: http://forms:8080
      Formbase__MorphDb__ProjectId: ${SAEM_G_PLANT_PROJECT_ID}
      Formbase__Access__Keys__0: ${SAEM_G_PLANT_ACCESS_KEY}
      PGGSSENCMODE: disable
      <<: *quiet-probes
    volumes:
      - secrets:/secrets:ro
    depends_on:
      group-accounts: {condition: service_completed_successfully}
    healthcheck: *http-health

  formbase-g-office:
    <<: *group-store
    entrypoint: ["sh", "-c", ". /secrets/g-office.env && exec dotnet Formbase.Host.dll"]
    environment:
      <<: *group-store-env
      Formbase__Schema: ${SAEM_G_OFFICE_SCHEMA}
      Formbase__MorphDb__ProjectId: ${SAEM_G_OFFICE_PROJECT_ID}
      Formbase__Access__Keys__0: ${SAEM_G_OFFICE_ACCESS_KEY}

  seed:
    build: {context: .., dockerfile: deploy/Dockerfile, target: provision}
    entrypoint: ["/provision/seed.sh"]
    environment:
      SAEM_FORMS_MASTER_SECRET: ${SAEM_FORMS_MASTER_SECRET}
      SAEM_SOURCE_PROJECT_ID: ${SAEM_SOURCE_PROJECT_ID}
    volumes:
      - state:/data
    depends_on:
      formbase: {condition: service_healthy}
    restart: "no"

  # One executor for each group: it holds that group's account on the source and no other's.
  executor-g-plant: &executor
    build: {context: .., dockerfile: deploy/Dockerfile, target: executor}
    entrypoint: ["sh", "-c", ". /secrets/g-plant.env && exec dotnet saem-materialize.dll serve --catalog /data/catalog.json --sources /data/groups/g-plant/sources.json --group g-plant --base-iri https://example.org/saem/ontology/ --store http://formbase-g-plant:8080 --listen http://0.0.0.0:8080"]
    environment:
      SAEM_STORE_TOKEN: ${SAEM_G_PLANT_ACCESS_KEY}
      SAEM_EXECUTOR_SECRET: ${SAEM_G_PLANT_EXECUTOR_SECRET}
    volumes:
      - state:/data
      - secrets:/secrets:ro
    depends_on:
      seed: {condition: service_completed_successfully}
      formbase-g-plant: {condition: service_healthy}
    healthcheck: *http-health

  executor-g-office:
    <<: *executor
    entrypoint: ["sh", "-c", ". /secrets/g-office.env && exec dotnet saem-materialize.dll serve --catalog /data/catalog.json --sources /data/groups/g-office/sources.json --group g-office --base-iri https://example.org/saem/ontology/ --store http://formbase-g-office:8080 --listen http://0.0.0.0:8080"]
    environment:
      SAEM_STORE_TOKEN: ${SAEM_G_OFFICE_ACCESS_KEY}
      SAEM_EXECUTOR_SECRET: ${SAEM_G_OFFICE_EXECUTOR_SECRET}
    depends_on:
      seed: {condition: service_completed_successfully}
      formbase-g-office: {condition: service_healthy}

  mcp:
    build: {context: .., dockerfile: deploy/Dockerfile, target: mcp}
    environment:
      ASPNETCORE_URLS: http://+:8080
      Saem__Ontology: /data/catalog.json
      Saem__Identity__Authority: *issuer
      Saem__Identity__Audience: saem
      Saem__Identity__RequireHttpsMetadata: "false"
      Saem__Sources__MorphDb__forms__Url: http://forms:8080
      Saem__Sources__MorphDb__forms__ProjectId: ${SAEM_SOURCE_PROJECT_ID}
      Saem__Sources__MorphDb__forms__Audience: morphdb
      Saem__Sources__TokenExchange__TokenEndpoint: http://issuer.localhost:${SAEM_ISSUER_PORT}/rig/token
      Saem__Sources__TokenExchange__ClientId: saem
      Saem__Sources__TokenExchange__ClientSecret: ${SAEM_EXCHANGE_CLIENT_SECRET}
      Saem__Materialization__BaseIri: https://example.org/saem/ontology/
      Saem__Materialization__Groups__g-plant__Url: http://formbase-g-plant:8080
      Saem__Materialization__Groups__g-plant__AccessKey: ${SAEM_G_PLANT_ACCESS_KEY}
      Saem__Materialization__Groups__g-office__Url: http://formbase-g-office:8080
      Saem__Materialization__Groups__g-office__AccessKey: ${SAEM_G_OFFICE_ACCESS_KEY}
      <<: *quiet-probes
    volumes:
      - state:/data
    ports:
      - "127.0.0.1:${SAEM_MCP_PORT}:8080"
    depends_on:
      forms: {condition: service_healthy}
      issuer: {condition: service_started}
      seed: {condition: service_completed_successfully}
    healthcheck: *http-health

  console:
    build: {context: .., dockerfile: deploy/Dockerfile, target: console}
    environment:
      ASPNETCORE_URLS: http://+:8080
      Saem__Console__Identity__Authority: *issuer
      Saem__Console__Identity__RequireHttpsMetadata: "false"
      Saem__Console__Identity__Audience: saem-console
      Saem__Console__Identity__ClientId: saem-console
      Saem__Console__Identity__ClientSecret: ${SAEM_CONSOLE_CLIENT_SECRET}
      Saem__Console__Identity__Scopes__0: saem-rig
      Saem__Console__Roles__Builders__0: g-plant
      Saem__Console__Ontology: /data/catalog.json
      Saem__Console__Draft: /data/draft.json
      Saem__Console__Proposals: /data/proposals.json
      Saem__Console__Confirmations: /data/confirmations.jsonl
      Saem__Console__SettledRecords: /data/settled.jsonl
      Saem__Console__Executors__g-plant__Address: http://executor-g-plant:8080
      Saem__Console__Executors__g-plant__Secret: ${SAEM_G_PLANT_EXECUTOR_SECRET}
      Saem__Console__Executors__g-office__Address: http://executor-g-office:8080
      Saem__Console__Executors__g-office__Secret: ${SAEM_G_OFFICE_EXECUTOR_SECRET}
      <<: *quiet-probes
    volumes:
      - state:/data
    ports:
      - "127.0.0.1:${SAEM_CONSOLE_PORT}:8080"
    depends_on:
      issuer: {condition: service_started}
      seed: {condition: service_completed_successfully}
    healthcheck: *http-health

  # Not part of the running stack: `docker compose run --rm correct` files one corrected work order in the source (docs/install.md).
  correct:
    build: {context: .., dockerfile: deploy/Dockerfile, target: provision}
    profiles: [correct]
    entrypoint: ["/provision/correct.sh"]
    depends_on:
      formbase: {condition: service_healthy}
    restart: "no"

  # Not part of the running stack: `docker compose run --rm check` asks the sample the questions its answers are known for.
  check:
    build: {context: .., dockerfile: deploy/Dockerfile, target: check}
    profiles: [check]
    environment:
      SAEM_ISSUER_URL: *issuer
      SAEM_G_PLANT_EXECUTOR_SECRET: ${SAEM_G_PLANT_EXECUTOR_SECRET}
      SAEM_G_OFFICE_EXECUTOR_SECRET: ${SAEM_G_OFFICE_EXECUTOR_SECRET}
      SAEM_G_PLANT_ACCESS_KEY: ${SAEM_G_PLANT_ACCESS_KEY}
      SAEM_G_OFFICE_ACCESS_KEY: ${SAEM_G_OFFICE_ACCESS_KEY}
      SAEM_G_PLANT_PROJECT_ID: ${SAEM_G_PLANT_PROJECT_ID}
      SAEM_G_OFFICE_PROJECT_ID: ${SAEM_G_OFFICE_PROJECT_ID}
      SAEM_CHECK_CLIENT_SECRET: ${SAEM_EXCHANGE_CLIENT_SECRET}
      SAEM_FORMS_MASTER_SECRET: ${SAEM_FORMS_MASTER_SECRET}
      SAEM_SOURCE_PROJECT_ID: ${SAEM_SOURCE_PROJECT_ID}
    volumes:
      - state:/data:ro
      - secrets:/secrets:ro
    depends_on:
      mcp: {condition: service_healthy}
      executor-g-plant: {condition: service_healthy}
      executor-g-office: {condition: service_healthy}
    restart: "no"

  # Optional: drafts the ontology from the filed forms with a model you name in deploy/.env (docs/install.md). A sample of the
  # forms' documents goes to that endpoint and nowhere else; the draft it writes waits for a person to confirm it in the console.
  author:
    build: {context: .., dockerfile: deploy/Dockerfile, target: author}
    profiles: [author]
    entrypoint:
      - sh
      - -c
      - |
        if [ -z "$$SAEM_MODEL_ENDPOINT" ] || [ -z "$$SAEM_MODEL" ]; then
          echo "No model is configured: set SAEM_MODEL_ENDPOINT, SAEM_MODEL and SAEM_MODEL_API_KEY in deploy/.env. The sample works without one." >&2
          exit 2
        fi
        exec dotnet saem-author.dll --formbase http://formbase:8080 --sources /data/sources.json --catalog /data/catalog.json \
          --model-endpoint "$$SAEM_MODEL_ENDPOINT" --model "$$SAEM_MODEL" --model-stream \
          --review /data/review.md --draft /data/draft.json --proposals /data/proposals.json --overwrite
    environment:
      SAEM_MODEL_ENDPOINT: ${SAEM_MODEL_ENDPOINT:-}
      SAEM_MODEL: ${SAEM_MODEL:-}
      SAEM_MODEL_API_KEY: ${SAEM_MODEL_API_KEY:-}
    volumes:
      - state:/data
    depends_on:
      formbase: {condition: service_healthy}
    restart: "no"

volumes:
  forms-db:
  state:
  secrets:
