# The rig's sources and the issuer they trust, on one private network. Nothing is published to the
# host: probes run inside the network (see probe-postgres.sh), so a port already taken on the
# developer's machine cannot make the rig talk to something else.
#
#   docker compose -f tests/rig/compose.yaml up -d --build --wait
#   sh tests/rig/probe-postgres.sh
#   sh tests/rig/probe-mysql.sh
#   docker compose -f tests/rig/compose.yaml down -v

name: saem-rig

services:
  issuer:
    # Any OIDC issuer would do (the rig is not tied to an identity product); this one is a
    # development issuer whose token claims are configured per request.
    image: ghcr.io/navikt/mock-oauth2-server:6.0.4
    environment:
      JSON_CONFIG_PATH: /config/config.json
      SERVER_PORT: "8080"
    volumes:
      - ./issuer/config.json:/config/config.json:ro

  mes:
    build: ./postgres
    environment:
      POSTGRES_PASSWORD: rig-superuser-local-only
      RIG_OAUTH_ISSUER: http://issuer:8080/rig
      RIG_OAUTH_SCOPE: saem-rig
    depends_on:
      - issuer
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "/var/run/postgresql", "-U", "postgres"]
      interval: 3s
      retries: 20
      start_period: 300s

  erp:
    build: ./mysql
    environment:
      MYSQL_ROOT_PASSWORD: rig-superuser-local-only
    depends_on:
      - issuer
    healthcheck:
      # Over TCP: the entrypoint's initialisation server listens on the socket only, so a socket ping
      # would report healthy before the real server is up.
      test: ["CMD", "mysqladmin", "ping", "--silent", "-h", "127.0.0.1", "-uroot", "-prig-superuser-local-only"]
      interval: 3s
      retries: 20
      # The first start initialises the data directory and runs the init scripts before the real
      # server listens; on a loaded Docker host that took over two minutes.
      start_period: 300s
