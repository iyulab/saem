# The interim password-login profile (see postgres/initdb/30-password-login.sh): alice and bob -- and
# fifty synthetic people, for measuring many at once -- may also log in to mes with a password, over
# TLS, and mes is reachable from the host -- on the loopback address only -- so saem's adapter tests
# can open sessions to it.
#
#   docker compose -f tests/rig/compose.yaml -f tests/rig/compose.password-login.yaml up -d --build --wait
#   SAEM_RIG_MES="Host=127.0.0.1;Port=55432;Database=postgres;SSL Mode=Require" \
#     dotnet test tests/Saem.Connectors.Postgres.Tests -p:IncludeRigLiveTests=true
#   docker compose -f tests/rig/compose.yaml -f tests/rig/compose.password-login.yaml down -v

services:
  mes:
    environment:
      RIG_PASSWORD_LOGIN: "on"
    ports:
      - "127.0.0.1:${SAEM_RIG_MES_PORT:-55432}:5432"
