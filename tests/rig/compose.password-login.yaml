# The interim password-login profile (see the 30-password-login.sh scripts of postgres/ and mysql/):
# alice and bob -- and, on mes, fifty synthetic people for measuring many at once -- each get a
# password login of their own to mes and erp that the source treats as them, over TLS, and both
# sources are reachable from the host -- on the loopback address only -- so saem's adapter tests can
# open sessions to them. The issuer is reachable the same way, so the MCP server's tests can ask it
# for a person's token and present it.
#
#   docker compose -f tests/rig/compose.yaml -f tests/rig/compose.password-login.yaml up -d --build --wait
#   SAEM_RIG_MES="Host=127.0.0.1;Port=55432;Database=postgres;SSL Mode=Require" \
#   SAEM_RIG_ERP="Server=127.0.0.1;Port=53306;Database=erp;SslMode=Required" \
#   SAEM_RIG_ISSUER="http://127.0.0.1:58080/rig" \
#     dotnet test --solution saem.slnx -p:IncludeRigLiveTests=true
#   docker compose -f tests/rig/compose.yaml -f tests/rig/compose.password-login.yaml down -v

services:
  mes:
    environment:
      RIG_PASSWORD_LOGIN: "on"
    ports:
      - "127.0.0.1:${SAEM_RIG_MES_PORT:-55432}:5432"

  issuer:
    ports:
      - "127.0.0.1:${SAEM_RIG_ISSUER_PORT:-58080}:8080"

  erp:
    environment:
      RIG_PASSWORD_LOGIN: "on"
    ports:
      - "127.0.0.1:${SAEM_RIG_ERP_PORT:-53306}:3306"
